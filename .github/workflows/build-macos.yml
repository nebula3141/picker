name: build-macos

# Builds the macOS .app + .dmg. Runs on demand and on version tags; when a
# matching GitHub Release exists (e.g. tag v4.11.0) the .dmg is uploaded to it.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build PICker.app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-13      # Intel (x86_64)
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import sys; sys.path.insert(0,"src"); import picker; print(picker.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Generate .icns icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "src")
          from PyQt6.QtWidgets import QApplication
          app = QApplication.instance() or QApplication([])
          from picker.icon import _make_pixmap
          pm = _make_pixmap(1024)
          pm.save("icon_1024.png", "PNG")
          print("wrote icon_1024.png", pm.width(), "x", pm.height())
          PY
          mkdir -p PICker.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s icon_1024.png --out "PICker.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); sips -z $d $d icon_1024.png --out "PICker.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          cp icon_1024.png PICker.iconset/icon_512x512@2x.png
          iconutil -c icns PICker.iconset -o icon.icns
          ls -la icon.icns

      - name: Build .app
        run: pyinstaller --noconfirm PICker_mac.spec

      - name: Smoke test (--version + HEIF decoder bundled)
        run: |
          ./dist/PICker.app/Contents/MacOS/PICker --version
          echo "checking native HEIF decoder is bundled…"
          found=$(find dist/PICker.app -name "_pillow_heif*.so" -print -quit)
          if [ -z "$found" ]; then
            echo "::error::_pillow_heif native module missing from the .app — HEIC/AVIF would fail"
            exit 1
          fi
          echo "ok: $found"

      - name: Package .dmg
        run: |
          V="${{ steps.ver.outputs.version }}"
          A="${{ matrix.arch }}"
          hdiutil create -volname "PICker $V" -srcfolder "dist/PICker.app" \
            -ov -format UDZO "PICker-$V-macOS-$A.dmg"
          ls -la "PICker-$V-macOS-$A.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PICker-macOS-${{ matrix.arch }}
          path: PICker-*-macOS-*.dmg

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" PICker-*-macOS-*.dmg --clobber
